services:
  security-backend:
    build:
      context: ./docker/security-backend
    image: solay39-security-backend:local
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      SECURITY_API_KEY: ${SECURITY_API_KEY:?SECURITY_API_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    read_only: true
    tmpfs:
      - /tmp/contracts:rw,noexec,nosuid,nodev,size=256m
      - /tmp/reports:rw,noexec,nosuid,nodev,size=128m
      - /run:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
