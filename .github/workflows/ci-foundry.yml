name: CI - Foundry tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  foundry:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Solidity dependencies
        shell: bash
        run: |
          set -euo pipefail
          [ -f lib/forge-std/src/Test.sol ] || { rm -rf lib/forge-std; git clone -q --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std; }
          [ -d lib/openzeppelin-contracts/contracts ] || git clone -q --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - name: Verify Foundry tools
        shell: bash
        run: |
          set -euo pipefail
          forge --version
          cast --version
          chisel --version

      - name: Run Forge tests
        shell: bash
        run: forge test -vvvv

      - name: Run Forge coverage
        shell: bash
        run: forge coverage --ir-minimum --report summary --report lcov
