name: Skynet Monitor

# Vercel Hobby crons run at most once per day; this workflow drives the
# 5-minute post-audit monitoring poll for free via GitHub Actions.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: skynet-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ vars.APP_URL || 'https://solay39.eu' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Poll monitored contracts
        run: |
          AUTH=()
          if [ -n "$CRON_SECRET" ]; then AUTH=(-H "Authorization: Bearer $CRON_SECRET"); fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 120 \
            "${AUTH[@]}" "$APP_URL/api/skynet-realtime?action=poll")
          echo "HTTP $status"
          head -c 2000 response.json; echo
          test "$status" -lt 400
