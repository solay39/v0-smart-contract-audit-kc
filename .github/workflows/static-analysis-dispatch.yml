name: Static Analysis Dispatch
run-name: static-analysis ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id generated by the app"
        required: true
        type: string
      contract_name:
        description: "Contract name"
        required: false
        default: "Contract"
        type: string
      source_gz_b64:
        description: "Solidity source, gzip + base64"
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout analysis toolchain
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ""

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Slither, Mythril, solc-select
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer mythril solc-select

      - name: Write contract
        env:
          SRC: ${{ inputs.source_gz_b64 }}
        run: |
          mkdir -p work out
          printf '%s' "$SRC" | base64 -d | gunzip > work/Contract.sol
          wc -l work/Contract.sol

      - name: Select solc and dependencies
        id: solc
        run: |
          ver=$(grep -oE 'pragma solidity[^;]+' work/Contract.sol | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          ver=${ver:-0.8.24}
          solc-select install "$ver"
          solc-select use "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          minor=$(echo "$ver" | cut -d. -f3)
          major=$(echo "$ver" | cut -d. -f2)
          REMAPS=""
          if grep -q '@openzeppelin/' work/Contract.sol; then
            if [ "$major" -ge 8 ] && [ "$minor" -ge 20 ]; then oz=5; else oz=4.9.6; fi
            (cd work && npm init -y >/dev/null && npm i --silent "@openzeppelin/contracts@$oz" "@openzeppelin/contracts-upgradeable@$oz")
            REMAPS="@openzeppelin/=$(pwd)/work/node_modules/@openzeppelin/"
          fi
          echo "remaps=$REMAPS" >> "$GITHUB_OUTPUT"
          printf '{"solc":"%s"}' "$ver" > out/meta.json

      - name: Run Slither
        run: |
          set -euo pipefail
          slither --version > out/slither-version.txt 2>&1
          ARGS=()
          if [ -n "${{ steps.solc.outputs.remaps }}" ]; then ARGS+=(--solc-remaps "${{ steps.solc.outputs.remaps }}"); fi
          set +e
          slither work/Contract.sol "${ARGS[@]}" --json out/slither.json > out/slither.log 2>&1
          status=$?
          set -e
          SLITHER_STATUS=$status python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('out/slither.json')
          if not p.exists() or p.stat().st_size == 0:
              raise SystemExit('Slither did not produce a JSON artifact')
          data = json.loads(p.read_text())
          if not isinstance(data.get('results', {}).get('detectors'), list):
              raise SystemExit('Slither artifact has no detector list')
          print(f'Slither completed with {len(data["results"]["detectors"])} findings; exit={os.environ["SLITHER_STATUS"]}')
          PY

      - name: Run Mythril
        run: |
          set -euo pipefail
          myth version > out/mythril-version.txt 2>&1
          REMAP_JSON=""
          if [ -n "${{ steps.solc.outputs.remaps }}" ]; then
            printf '{"remappings":["%s"]}' "${{ steps.solc.outputs.remaps }}" > work/solc.json
            REMAP_JSON="--solc-json work/solc.json"
          fi
          set +e
          timeout 900 myth analyze work/Contract.sol $REMAP_JSON -o json --execution-timeout 300 > out/mythril.json 2> out/mythril.log
          status=$?
          set -e
          MYTHRIL_STATUS=$status python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('out/mythril.json')
          if not p.exists() or p.stat().st_size == 0:
              raise SystemExit('Mythril did not produce a JSON artifact')
          data = json.loads(p.read_text())
          if not isinstance(data.get('issues'), list):
              raise SystemExit('Mythril artifact has no issues list')
          print(f'Mythril completed with {len(data["issues"])} findings; exit={os.environ["MYTHRIL_STATUS"]}')
          PY

      - name: Run custom regression checks
        run: |
          python .github/audit/custom_analysis.py work/Contract.sol > out/custom.json

      - name: Run repository Foundry tests and fuzzing
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup
          if [ ! -f foundry.toml ]; then
            printf '{"success":false,"tool":"foundry","mode":"repository-tests","error":"foundry.toml_missing"}' > out/foundry.json
            exit 1
          fi
          set +e
          forge test -vvv > out/foundry.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '{"success":false,"tool":"foundry","mode":"repository-tests-and-fuzzing","error":"forge_test_failed"}' > out/foundry.json
            cat out/foundry.log
            exit "$status"
          fi
          python - <<'PY'
          import json, pathlib, re
          log = pathlib.Path('out/foundry.log').read_text()
          fuzz_runs = len(re.findall(r'fuzz', log, re.I))
          json.dump({'success': True, 'tool': 'foundry', 'mode': 'repository-tests-and-fuzzing', 'invariants': len(re.findall(r'invariant', log, re.I)), 'fuzz_runs_detected': fuzz_runs}, open('out/foundry.json', 'w'))
          PY

      - name: Create evidence manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = {}
          for p in sorted(Path('out').glob('*')):
              if p.is_file(): files[p.name] = hashlib.sha256(p.read_bytes()).hexdigest()
          Path('out/evidence-manifest.json').write_text(json.dumps({'job_id': '${{ inputs.job_id }}', 'source_sha256': hashlib.sha256(Path('work/Contract.sol').read_bytes()).hexdigest(), 'artifacts': files}, indent=2))
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-${{ inputs.job_id }}
          path: out/
          retention-days: 30
