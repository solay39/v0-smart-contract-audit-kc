name: Static Analysis Dispatch
run-name: static-analysis ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id generated by the app"
        required: true
        type: string
      contract_name:
        description: "Contract name"
        required: false
        default: "Contract"
        type: string
      source_gz_b64:
        description: "Solidity source, gzip + base64"
        required: true
        type: string
      benchmark:
        description: "Optional trusted harness for the exact pinned public Aero snapshot"
        required: false
        default: none
        type: choice
        options: [none, aero-authorization-v1, aero-erc20-v2]

permissions:
  contents: read

jobs:
  aero-source-verification:
    if: ${{ inputs.benchmark == 'aero-erc20-v2' }}
    uses: ./.github/workflows/aero-source-verification.yml
    with:
      source_gz_b64: ${{ inputs.source_gz_b64 }}

  aero-benchmark:
    if: ${{ inputs.benchmark == 'aero-authorization-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decode and enforce the one permitted source snapshot
        env:
          SRC: ${{ inputs.source_gz_b64 }}
        run: |
          python3 .github/audit/decode_source.py
          echo "52e494f011e5966f6d1f67045f89ca60843a48a00082c0032dd0ae77da3fe682  work/Contract.sol" | sha256sum --check
          mkdir -p benchmark/src benchmark/test benchmark-evidence
          cp work/Contract.sol benchmark/src/Aero.sol
          cp work/Contract.sol benchmark-evidence/Aero.sol
          cp tests/security/AeroSourceAuthorization.t.sol benchmark/test/
          cp tests/security/AeroSourceAuthorization.t.sol benchmark-evidence/
          cp .github/audit/aero-benchmark.toml benchmark/foundry.toml
          cp .github/audit/aero-benchmark.toml benchmark-evidence/
      - name: Install pinned Foundry
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error https://foundry.paradigm.xyz | bash
          for dir in "$HOME/.foundry/bin" "$HOME/.config/.foundry/bin" "$HOME/.config/foundry/bin"; do
            if [ -d "$dir" ]; then
              export PATH="$dir:$PATH"
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done
          foundryup --install v1.9.0
          forge --version > benchmark-evidence/foundry-version.txt
      - name: Execute trusted source authorization assertions
        run: |
          set +e
          forge test --root benchmark --match-contract AeroSourceAuthorizationTest --json > benchmark-evidence/forge-results.json 2> benchmark-evidence/forge-stderr.log
          status=$?
          printf '%s\n' "$status" > benchmark-evidence/forge-exit-code.txt
          exit "$status"
      - name: Summarize observed results without approval claims
        if: always()
        run: |
          mkdir -p benchmark-evidence
          python3 .github/audit/finalize_aero_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aero-source-benchmark-${{ inputs.job_id }}-attempt-${{ github.run_attempt }}
          path: benchmark-evidence
          retention-days: 30

  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout analysis toolchain
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install isolated Slither and solc-select
        id: security_tools
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/security-tools"
          TOOL_PY="$RUNNER_TEMP/security-tools/bin/python"
          "$TOOL_PY" -m pip install --upgrade pip wheel
          "$TOOL_PY" -m pip install "slither-analyzer==0.11.6" "solc-select==1.2.0"
          "$TOOL_PY" -m pip check
          mkdir -p out
          "$TOOL_PY" -m pip freeze > out/pip-freeze.txt
          echo "$RUNNER_TEMP/security-tools/bin" >> "$GITHUB_PATH"

      - name: Install isolated Mythril
        id: mythril_tools
        continue-on-error: true
        run: |
          # Mythril's legacy Ethereum dependencies must not overwrite Slither's.
          python -m venv "$RUNNER_TEMP/mythril-tools"
          TOOL_PY="$RUNNER_TEMP/mythril-tools/bin/python"
          "$TOOL_PY" -m pip install --upgrade pip wheel
          "$TOOL_PY" -m pip install "setuptools<81" "numpy==1.26.4" --only-binary=:all:
          "$TOOL_PY" -m pip install --no-build-isolation "mythril==0.24.8"
          "$TOOL_PY" -m pip check
          mkdir -p out
          "$TOOL_PY" -m pip freeze > out/mythril-pip-freeze.txt
          echo "$RUNNER_TEMP/mythril-tools/bin" >> "$GITHUB_PATH"

      - name: Write contract
        id: sources
        env:
          SRC: ${{ inputs.source_gz_b64 }}
          CONTRACT_NAME: ${{ inputs.contract_name }}
        run: |
          python .github/audit/decode_source.py
          python .github/audit/materialize_sources.py work/Contract.sol work/sources "$CONTRACT_NAME" >> "$GITHUB_OUTPUT"
          wc -l work/Contract.sol

      - name: Select solc and dependencies
        id: solc
        continue-on-error: true
        run: |
          ver=$(grep -oE 'pragma solidity[^;]+' work/Contract.sol | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          ver=${ver:-0.8.24}
          # binaries.soliditylang.org returns 403 on GitHub-hosted runners.
          # Use the official Solidity GitHub release asset instead.
          SOLC_DIR="$RUNNER_TEMP/solc/$ver"
          mkdir -p "$SOLC_DIR"
          curl --fail --location --retry 4 --retry-delay 3 --silent --show-error \
            "https://github.com/ethereum/solidity/releases/download/v${ver}/solc-static-linux" \
            --output "$SOLC_DIR/solc"
          chmod +x "$SOLC_DIR/solc"
          export PATH="$SOLC_DIR:$PATH"
          echo "$SOLC_DIR" >> "$GITHUB_PATH"
          solc --version > out/solc-version.txt 2>&1
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          minor=$(echo "$ver" | cut -d. -f3)
          major=$(echo "$ver" | cut -d. -f2)
          REMAPS=""
          if grep -q '@openzeppelin/' work/Contract.sol && [ ! -d work/sources/@openzeppelin ]; then
            if [ "$major" -ge 8 ] && [ "$minor" -ge 20 ]; then oz=5.0.2; else oz=4.9.6; fi
            (cd work/sources && npm init -y >/dev/null && npm i --silent "@openzeppelin/contracts@$oz" "@openzeppelin/contracts-upgradeable@$oz")
            REMAPS="@openzeppelin/=$(pwd)/work/sources/node_modules/@openzeppelin/"
          fi
          echo "remaps=$REMAPS" >> "$GITHUB_OUTPUT"
          printf '{"solc":"%s"}' "$ver" > out/meta.json

      - name: Run Slither
        id: slither
        continue-on-error: true
        if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.solc.outcome == 'success' && steps.security_tools.outcome == 'success' }}
        env:
          ENTRY: ${{ steps.sources.outputs.entry }}
          REMAPS: ${{ steps.solc.outputs.remaps }}
        run: |
          set -euo pipefail
          slither --version > out/slither-version.txt 2>&1
          ARGS=()
          if [ -n "$REMAPS" ]; then ARGS+=(--solc-remaps "$REMAPS"); fi
          # crytic-compile discovers parent project configuration before honoring
          # the forced framework. An isolated tree prevents repo Foundry detection.
          SOURCE_ROOT=$(mktemp -d "$RUNNER_TEMP/solay39-slither.XXXXXX")
          cp -a work/sources/. "$SOURCE_ROOT/"
          set +e
          (cd "$SOURCE_ROOT" && slither "$ENTRY" "${ARGS[@]}" --compile-force-framework solc --exclude-informational --json "$GITHUB_WORKSPACE/out/slither.json") > out/slither.log 2>&1
          status=$?
          set -e
          SLITHER_STATUS=$status python - <<'PY'
          import json, os, pathlib
          pathlib.Path('out/slither-execution.json').write_text(json.dumps({'exit_code': int(os.environ['SLITHER_STATUS'])}))
          p = pathlib.Path('out/slither.json')
          log = pathlib.Path('out/slither.log').read_text(errors='replace')
          if not p.exists() or p.stat().st_size == 0:
              # Slither can exit before writing JSON when solc/import resolution
              # fails. Preserve that failure as machine-readable evidence.
              p.write_text(json.dumps({
                  'success': False,
                  'error': 'slither_failed_before_json_output',
                  'exit_code': int(os.environ['SLITHER_STATUS']),
                  'stderr': log[-8000:],
                  'results': {'detectors': []},
              }, indent=2))
          data = json.loads(p.read_text())
          # Slither emits results={} for a successful run with zero findings.
          detectors = (data.get('results') or {}).get('detectors', [])
          if not isinstance(detectors, list):
              raise SystemExit('Slither artifact has no detector list')
          print(f'Slither completed with {len(detectors)} findings; exit={os.environ["SLITHER_STATUS"]}')
          PY

      - name: Run Mythril
        id: mythril
        continue-on-error: true
        if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.solc.outcome == 'success' && steps.mythril_tools.outcome == 'success' }}
        env:
          ENTRY: ${{ steps.sources.outputs.entry }}
          REMAPS: ${{ steps.solc.outputs.remaps }}
        run: |
          set -euo pipefail
          myth version > out/mythril-version.txt 2>&1
          ARGS=()
          if [ -n "$REMAPS" ]; then
            printf '{"remappings":["%s"]}' "$REMAPS" > work/solc.json
            ARGS+=(--solc-json "$GITHUB_WORKSPACE/work/solc.json")
          fi
          set +e
          (cd work/sources && timeout 900 myth analyze "$ENTRY" "${ARGS[@]}" -o json --execution-timeout 300) > out/mythril.json 2> out/mythril.log
          status=$?
          set -e
          MYTHRIL_STATUS=$status python - <<'PY'
          import json, os, pathlib
          pathlib.Path('out/mythril-execution.json').write_text(json.dumps({'exit_code': int(os.environ['MYTHRIL_STATUS']), 'timed_out': os.environ['MYTHRIL_STATUS'] == '124'}))
          p = pathlib.Path('out/mythril.json')
          if not p.exists() or p.stat().st_size == 0:
              raise SystemExit('Mythril did not produce a JSON artifact')
          data = json.loads(p.read_text())
          if not isinstance(data.get('issues'), list):
              raise SystemExit('Mythril artifact has no issues list')
          print(f'Mythril completed with {len(data["issues"])} findings; exit={os.environ["MYTHRIL_STATUS"]}')
          PY

      - name: Run custom regression checks
        id: custom
        continue-on-error: true
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: |
          python .github/audit/custom_analysis.py work/Contract.sol > out/custom.json

      - name: Compile submitted contract with Foundry
        id: foundry
        continue-on-error: true
        if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.solc.outcome == 'success' }}
        env:
          ENTRY: ${{ steps.sources.outputs.entry }}
          REMAPS: ${{ steps.solc.outputs.remaps }}
          SOLC_VERSION: ${{ steps.solc.outputs.version }}
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error https://foundry.paradigm.xyz | bash
          for dir in "$HOME/.foundry/bin" "$HOME/.config/.foundry/bin" "$HOME/.config/foundry/bin"; do
            if [ -d "$dir" ]; then
              export PATH="$dir:$PATH"
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done
          foundryup --install v1.9.0
          forge --version > out/foundry-version.txt 2>&1
          mkdir -p submitted/src submitted/test
          cp -R work/sources/. submitted/src/
          cat > submitted/foundry.toml <<'EOF'
          [profile.default]
          src = 'src'
          test = 'test'
          out = 'out'
          libs = ['lib']
          bytecode_hash = 'none'
          EOF
          if [ -n "$REMAPS" ]; then printf '%s\n' '@openzeppelin/=src/node_modules/@openzeppelin/' > submitted/remappings.txt; fi
          set +e
          (cd submitted && forge build "src/$ENTRY" --use "$SOLC_VERSION" --json) > out/foundry-build.json 2> out/foundry.log
          status=$?
          set -e
          printf '{"exit_code":%s}' "$status" > out/foundry-execution.json
          if [ "$status" -ne 0 ]; then
            python - "$status" <<'PY'
          import json, pathlib, sys
          json.dump({
              'success': False,
              'tool': 'foundry',
              'mode': 'submitted-contract-compilation',
              'tests_executed': False,
              'fuzzing_executed': False,
              'error': 'forge_build_failed',
              'exit_code': int(sys.argv[1]),
              'stderr': pathlib.Path('out/foundry.log').read_text(errors='replace')[-8000:],
          }, open('out/foundry.json', 'w'), indent=2)
          PY
            cat out/foundry.log
          else
          python - <<'PY'
          import json
          json.dump({'success': True, 'tool': 'foundry', 'mode': 'submitted-contract-compilation', 'tests_executed': False, 'fuzzing_executed': False, 'invariants': 0, 'note': 'Protocol-specific fuzzing and invariants require reviewer-supplied tests; no synthetic tests are claimed.'}, open('out/foundry.json', 'w'))
          PY
          fi

      - name: Create evidence manifest
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
          CONTRACT_NAME: ${{ inputs.contract_name }}
          SLITHER_OUTCOME: ${{ steps.slither.outcome }}
          MYTHRIL_OUTCOME: ${{ steps.mythril.outcome }}
          CUSTOM_OUTCOME: ${{ steps.custom.outcome }}
          FOUNDRY_OUTCOME: ${{ steps.foundry.outcome }}
        run: |
          python .github/audit/finalize_evidence.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-${{ inputs.job_id }}-attempt-${{ github.run_attempt }}
          path: out/
          retention-days: 30

      - name: Fail when contract analysis is incomplete
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('out/evidence-manifest.json').read_text())
          failed = [name for name in ('slither', 'mythril', 'custom_regression', 'foundry_compile') if not manifest['claims'].get(name)]
          if failed:
              raise SystemExit('Analysis incomplete: ' + ', '.join(failed) + '. Evidence was uploaded; this is not a successful audit.')
          PY
