name: Static Analysis Dispatch
run-name: static-analysis ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id generated by the app"
        required: true
        type: string
      contract_name:
        description: "Contract name"
        required: false
        default: "Contract"
        type: string
      source_gz_b64:
        description: "Solidity source, gzip + base64"
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ""

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Slither, Mythril, solc-select
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer mythril solc-select

      - name: Write contract
        env:
          SRC: ${{ inputs.source_gz_b64 }}
        run: |
          mkdir -p work out
          printf '%s' "$SRC" | base64 -d | gunzip > work/Contract.sol
          wc -l work/Contract.sol

      - name: Select solc and dependencies
        id: solc
        run: |
          ver=$(grep -oE 'pragma solidity[^;]+' work/Contract.sol | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          ver=${ver:-0.8.24}
          solc-select install "$ver"
          solc-select use "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          minor=$(echo "$ver" | cut -d. -f3)
          major=$(echo "$ver" | cut -d. -f2)
          REMAPS=""
          if grep -q '@openzeppelin/' work/Contract.sol; then
            if [ "$major" -ge 8 ] && [ "$minor" -ge 20 ]; then oz=5; else oz=4.9.6; fi
            (cd work && npm init -y >/dev/null && npm i --silent "@openzeppelin/contracts@$oz" "@openzeppelin/contracts-upgradeable@$oz")
            REMAPS="@openzeppelin/=$(pwd)/work/node_modules/@openzeppelin/"
          fi
          echo "remaps=$REMAPS" >> "$GITHUB_OUTPUT"
          printf '{"solc":"%s"}' "$ver" > out/meta.json

      - name: Run Slither
        run: |
          slither --version > out/slither-version.txt 2>&1 || true
          ARGS=""
          if [ -n "${{ steps.solc.outputs.remaps }}" ]; then ARGS="--solc-remaps ${{ steps.solc.outputs.remaps }}"; fi
          slither work/Contract.sol $ARGS --json out/slither.json > out/slither.log 2>&1 || true
          if [ ! -s out/slither.json ]; then
            printf '{"success":false,"error":"slither_report_unavailable","results":{"detectors":[]}}' > out/slither.json
          fi

      - name: Run Mythril
        run: |
          myth version > out/mythril-version.txt 2>&1 || true
          REMAP_JSON=""
          if [ -n "${{ steps.solc.outputs.remaps }}" ]; then
            printf '{"remappings":["%s"]}' "${{ steps.solc.outputs.remaps }}" > work/solc.json
            REMAP_JSON="--solc-json work/solc.json"
          fi
          timeout 900 myth analyze work/Contract.sol $REMAP_JSON -o json --execution-timeout 300 > out/mythril.json 2> out/mythril.log || true
          if [ ! -s out/mythril.json ]; then
            printf '{"success":false,"error":"mythril_report_unavailable","issues":[]}' > out/mythril.json
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-${{ inputs.job_id }}
          path: out/
          retention-days: 3
