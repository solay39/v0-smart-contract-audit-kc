name: Security checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Cache Foundry install
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            ~/.cache/foundry
          key: foundry-${{ runner.os }}-v1

      - name: Install isolated analysis tools
        uses: ./.github/actions/security-tools
      - name: Install Foundry (try official action, tolerant)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
        continue-on-error: true

      - name: Ensure Foundry installed (fallback installer)
        shell: bash
        run: |
          set -euxo pipefail
          if command -v forge >/dev/null 2>&1; then
            echo "forge already installed at $(command -v forge)"
            forge --version || true
            exit 0
          fi

          echo "forge not on PATH after foundry-toolchain action; attempting fallback..."
          curl -sSfL https://foundry.paradigm.xyz | bash || true

          for dir in "$HOME/.foundry/bin" "$HOME/.config/.foundry/bin" "$HOME/.config/foundry/bin"; do
            if [ -d "$dir" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              export PATH="$dir:$PATH"
            fi
          done

          if [ -x "$HOME/.foundry/bin/foundryup" ]; then
            "$HOME/.foundry/bin/foundryup" || true
          elif [ -x "$HOME/.config/.foundry/bin/foundryup" ]; then
            "$HOME/.config/.foundry/bin/foundryup" || true
          fi

          forge_path=$(find "$HOME" -maxdepth 6 -type f -name forge -executable -print -quit 2>/dev/null || true)
          if [ -n "$forge_path" ]; then
            forge_dir="$(dirname "$forge_path")"
            echo "$forge_dir" >> "$GITHUB_PATH"
            export PATH="$forge_dir:$PATH"
          fi

          if command -v forge >/dev/null 2>&1; then
            forge --version || true
          else
            echo "WARNING: forge not found; printing diagnostics" >&2
            ls -la "$HOME" "$HOME/.config" "$HOME/.foundry" 2>/dev/null || true
            find "$HOME" -maxdepth 6 -type f -name forge -print 2>/dev/null | head -n 50 || true
          fi
      - name: Ensure Foundry bin on PATH
        shell: bash
        run: |
          set -euxo pipefail
          candidates=(
            "$HOME/.foundry/bin"
            "$HOME/.config/.foundry/bin"
            "$HOME/.config/foundry/bin"
          )
          found=""
          for dir in "${candidates[@]}"; do
            if [ -d "$dir" ]; then
              echo "Found Foundry bin at: $dir"
              echo "$dir" >> "$GITHUB_PATH"
              export PATH="$dir:$PATH"
              found="$dir"
            fi
          done
          if [ -z "$found" ]; then
            forge_path=$(find "$HOME" -maxdepth 6 -type f -name forge -executable -print -quit 2>/dev/null || true)
            if [ -n "$forge_path" ]; then
              found="$(dirname "$forge_path")"
              echo "Found forge in: $found"
              echo "$found" >> "$GITHUB_PATH"
              export PATH="$found:$PATH"
            fi
          fi
          if [ -z "$found" ] || ! command -v forge >/dev/null 2>&1; then
            echo "Could not locate forge" >&2
            find "$HOME" -maxdepth 5 -type f -name forge -print 2>/dev/null || true
            exit 1
          fi
          forge --version

      - name: Install Solidity dependencies
        shell: bash
        run: |
          set -euo pipefail
          [ -f lib/forge-std/src/Test.sol ] || { rm -rf lib/forge-std; git clone -q --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std; }
          [ -d lib/openzeppelin-contracts/contracts ] || git clone -q --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - name: Run Forge tests
        run: |
          set -euo pipefail
          mkdir -p reports
          forge test -vvvv | tee reports/forge_output.txt
      - name: Run Forge coverage
        if: always()
        run: forge coverage --ir-minimum --report summary --report lcov | tee reports/coverage.txt || true
      - name: Run Slither
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          trap 'cat reports/slither_output.txt' EXIT
          slither . --config-file slither.config.json --fail-high --json reports/slither-report.json > reports/slither_output.txt 2>&1
          test -s reports/slither-report.json
      - name: Fail on Slither high or critical findings
        if: always()
        run: python3 scripts/validate-scanner-reports.py slither reports
      - name: Run Mythril
        run: |
          set -euo pipefail
          command -v myth
          for contract in contracts/Solay39EnterpriseRegistry.sol contracts/Solay39AuditRegistry.sol contracts/AuditRegistry.sol; do
            name="$(basename "$contract" .sol)"
            myth analyze "$contract" -o json --execution-timeout 120 > "reports/mythril-${name}.json"
            test -s "reports/mythril-${name}.json"
          done
      - name: Fail on Mythril high or critical findings
        if: always()
        run: python3 scripts/validate-scanner-reports.py mythril reports
      - name: Run Echidna
        if: hashFiles('echidna/echidna.yaml', 'echidna/EchidnaHarness.sol') != ''
        uses: crytic/echidna-action@v2
        with:
          files: echidna
          contract: EchidnaHarness
          config: echidna/echidna.yaml
          format: text
          output-file: reports/echidna_output.txt
      - name: Run real public benchmark
        run: npm run benchmark:real
      - name: Run fork PoC evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          FORK_RPC_URL: ${{ secrets.FORK_RPC_URL }}
          FORK_BLOCK_NUMBER: ${{ secrets.FORK_BLOCK_NUMBER }}
        run: npm run fork:poc
      - name: Aggregate security reports
        if: always()
        run: |
          mkdir -p reports
          python3 scripts/aggregate_reports.py --reports-dir reports --out reports/summary.json
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/**/*.json
            reports/*.txt
            out/**
          if-no-files-found: error
        
