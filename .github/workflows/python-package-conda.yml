name: Python tests and lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python check tools
        run: python -m pip install --upgrade pip flake8 pytest
      - name: Check Python syntax and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run benchmark unit tests
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v
      - name: Collect remaining Python style warnings
        if: always()
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
