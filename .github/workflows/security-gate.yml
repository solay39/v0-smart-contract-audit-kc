name: Solay39 Security Gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Slither and Mythril
        run: |
          python -m venv "$RUNNER_TEMP/security-tools"
          "$RUNNER_TEMP/security-tools/bin/python" -m pip install --upgrade pip wheel
          "$RUNNER_TEMP/security-tools/bin/python" -m pip install slither-analyzer mythril
          echo "$RUNNER_TEMP/security-tools/bin" >> "$GITHUB_PATH"
      - name: Required scanner preflight
        run: node scripts/require-security-tools.mjs
      - name: Benchmark evaluator tests
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v
