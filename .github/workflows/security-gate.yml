name: Solay39 Security Gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          # Mythril's legacy dependency chain does not build cleanly with NumPy
          # from source on Python 3.11+. Python 3.10 has compatible binary wheels.
          python-version: "3.10"
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Slither and Mythril
        uses: ./.github/actions/security-tools
      - name: Required scanner preflight
        run: node scripts/require-security-tools.mjs
      - name: TypeScript build checks
        run: pnpm test
      - name: Benchmark evaluator tests
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v
