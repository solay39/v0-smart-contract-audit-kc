name: Audit engine tests

on:
  pull_request:
    paths: ["core/**", "lib/slither-*.ts", "lib/*published-audit*.ts", "components/preliminary-audit-report.tsx", "app/audit/**", "app/api/audit/**", "app/api/audits/**", "app/api/publish/**", "tests/**", "app/api/ai-audit/**", "package.json", "pnpm-lock.yaml", ".github/workflows/engine-tests.yml"]
  push:
    branches: [main]
    paths: ["core/**", "lib/slither-*.ts", "lib/*published-audit*.ts", "components/preliminary-audit-report.tsx", "app/audit/**", "app/api/audit/**", "app/api/audits/**", "app/api/publish/**", "tests/**", "app/api/ai-audit/**", "package.json", "pnpm-lock.yaml", ".github/workflows/engine-tests.yml"]

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:engine
