name: Audit engine tests

on:
  pull_request:
    paths: ["core/**", "lib/**", "components/**", "app/audit/**", "app/api/**", "app/verification-updates/**", "public/evidence/**", "scripts/export-public-executions.mjs", "tsconfig.execution-summary.json", "tests/**", "package.json", "pnpm-lock.yaml", ".github/audit/**", ".github/workflows/static-analysis-dispatch.yml", ".github/workflows/engine-tests.yml"]
  push:
    branches: [main]
    paths: ["core/**", "lib/**", "components/**", "app/audit/**", "app/api/**", "app/verification-updates/**", "public/evidence/**", "scripts/export-public-executions.mjs", "tsconfig.execution-summary.json", "tests/**", "package.json", "pnpm-lock.yaml", ".github/audit/**", ".github/workflows/static-analysis-dispatch.yml", ".github/workflows/engine-tests.yml"]

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:engine
      - run: pnpm test:execution-types
      - run: python3 -m unittest discover -s tests -p test_materialize_sources.py
      - run: python3 -m unittest discover -s tests -p test_ci_evidence.py
      - run: python3 -m unittest discover -s tests -p test_aero_benchmark.py
      - run: python3 -m unittest discover -s tests -p test_source_verification.py
      - run: python3 -m unittest discover -s tests -p test_scanner_reports.py
