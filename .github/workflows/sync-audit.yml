name: Sync Audit from Supabase

on:
  # Manual trigger with audit ID input
  workflow_dispatch:
    inputs:
      audit_id:
        description: 'Audit ID to sync (e.g., alaya-governance-token-1774362339775)'
        required: true
        type: string

  # Optionally keep the schedule — but only runs if audit_id is provided manually
  # Remove the schedule block if you only want manual triggers
  # schedule:
  #   - cron: "*/15 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          AUDIT_ID: ${{ github.event.inputs.audit_id }}
          SUPABASE_API_URL: https://www.solay39.eu/api/audit
        run: |
          if [ -z "$AUDIT_ID" ]; then
            echo "ERROR: No audit_id provided. Please trigger manually with an audit ID."
            exit 1
          fi
          echo "Syncing audit: $AUDIT_ID"
          node scripts/sync-audit.mjs "$AUDIT_ID"

      - name: Commit and push
        run: |
          git config user.name "solay39-bot"
          git config user.email "bot@solay39.eu"

          git add audits/
          git diff --staged --quiet && echo "Nothing to commit" && exit 0

          COMMIT_MSG="Sync audit: ${{ github.event.inputs.audit_id }} ($(date -u +%Y-%m-%d))"
          git commit -m "$COMMIT_MSG"
          git push